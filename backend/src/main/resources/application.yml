server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ai-app
  profiles:
    active: local
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 与 app.rag.max-file-size 保持一致；超出由 GlobalExceptionHandler 转 400
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_app?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:ai_app}
    password: ${DB_PASSWORD:change_me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    db:
      enabled: true
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: 星屿 AI
    version: 0.0.1-SNAPSHOT
    description: M0 后端骨架（统一响应 / JWT / 可观测）

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    root: info
    com.tutuchacha.ai: debug

app:
  jwt:
    # 生产必须用环境变量 JWT_SECRET 覆盖（≥32 字节）
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes}
    expiration: 2h
  ai:
    # 百炼 OpenAI 兼容模式；Spring AI 会再拼 /v1/chat/completions，所以这里不带 /v1
    # Key 只走环境变量，不落仓库
    base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${DASHSCOPE_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:qwen-plus}
    temperature: 0.7
    # 输出上限：1024 会在一半处截断，qwen-plus 支持更大；可用 AI_MAX_TOKENS 覆盖
    max-tokens: ${AI_MAX_TOKENS:4096}
    # 向量模型：知识库切片用，换模型需重建索引
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
    # 单轮模型调用超时；超时返回 LLM_TIMEOUT，前端可重试
    timeout: ${AI_TIMEOUT:60s}
  chat:
    # 每人每分钟最多几轮；0 关闭限流（多实例部署换 Redis，M6）
    rate-limit-per-minute: ${CHAT_RATE_LIMIT:20}
  rag:
    # 文档落盘目录，相对启动目录；生产由 compose 挂卷
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size: ${RAG_MAX_FILE_SIZE:20MB}
    # 解析默认异步；测试/排障可设 false 走同步
    async: ${RAG_ASYNC:true}
    # 单次向量请求的切片数（百炼 v3 单批上限 10）
    embedding-batch-size: ${RAG_EMBEDDING_BATCH:10}
