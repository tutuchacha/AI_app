spring:
  datasource:
    url: jdbc:h2:mem:ai_app;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

management:
  health:
    db:
      enabled: false

app:
  rag:
    # 测试走同步解析，断言 READY 结果；上限调小便于验证超限分支
    upload-dir: ${java.io.tmpdir}/ai-app-test-uploads
    max-file-size: 1MB
    async: false
    embedding-batch-size: 2
    # H2 没有 pgvector，测试走 Java 余弦，播种向量用 3 维
    vector-store: memory
  analysis:
    # 同步执行，断言 READY / FAILED 结果；正文上限调小便于验证截断
    async: false
    max-chars: 2000
    max-chunks: 10
    max-tokens: 512
  metrics:
    # 测试不连 Prometheus，走数据库口径
    enabled: false
