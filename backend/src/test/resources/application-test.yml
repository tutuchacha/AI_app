spring:
  datasource:
    url: jdbc:h2:mem:ai_app;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

management:
  health:
    db:
      enabled: false

app:
  rag:
    # 测试走同步解析，断言 READY 结果；上限调小便于验证超限分支
    upload-dir: ${java.io.tmpdir}/ai-app-test-uploads
    max-file-size: 1MB
    async: false
    embedding-batch-size: 2
